<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анфилада арок · прототип</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
/* Прототип блока «Ведущие»: анфилада арок в сумеречном лесу терновника. Передняя арка по центру, остальные уходят
   вглубь по дуге к свету. С каждым шагом теплеет небо, терн зацветает, в тоннеле летит золотая пыльца, у финала —
   лепестки: путь «от страха к любви». Дымка — только вокруг тоннеля. Палитра и шрифты страницы — как на сайте. */
:root{
  --ink:#3b2731; --soft:#7a6068; --bg:#fffaf5; --line:#f0ddd0;
  --accent:#b54a3a; --accent-2:#d9692f;
  --font-display:"Lora", Georgia, serif;
  --font-body:"Inter", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
.note{font-size:.8rem;color:var(--soft);text-align:center;padding:8px 16px;background:#f6e6ef}
.head{padding:40px 0 20px;display:grid;gap:10px}
.eyebrow{font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--accent)}
h2{font:500 clamp(2rem,1.6rem + 2vw,3rem)/1.15 var(--font-display);margin:0}

/* сцена */
.scene{position:relative;height:min(74vh,700px);min-height:440px;border-radius:22px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#4a3048}
.world{position:absolute;inset:0}
/* тёплые сумерки: сливово-розовый верх, у горизонта — персиковая полоса, будто за лесом встаёт солнце */
.sky{position:absolute;left:0;right:0;top:0;background:linear-gradient(180deg,#4a2c4a 0%,#7a4664 36%,#b46c7a 64%,#e49a8c 85%,#f8c69a 100%)}
.water{position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,#dc9a8e 0%,#a86a76 22%,#734660 60%,#55344f 100%)}
.haze{position:absolute;left:0;right:0;height:24%;transform:translateY(-60%);pointer-events:none;
  background:linear-gradient(180deg,rgba(255,206,180,0),rgba(255,218,190,.36) 55%,rgba(255,206,180,0))}
/* рассвет: с каждым шагом вглубь сцена теплеет и светлеет, к финалу заливает персиком */
.dawn{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,rgba(255,190,150,.32) 0%,rgba(255,202,156,.5) 48%,rgba(255,224,176,.62) 64%,rgba(255,200,156,.38) 100%)}
/* виньетка по краям: в начале пути гуще, к финалу почти исчезает */
.dusk{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 55%,rgba(52,24,38,0) 40%,rgba(52,24,38,.6) 100%)}
.fx{position:absolute;inset:0;width:100%;height:100%;z-index:140;pointer-events:none}
/* плавающие стрелки в стеклянных кружках: справа выше — вперёд, вглубь; слева ниже — шаг назад */
.way{position:absolute;left:0;top:0;z-index:160;width:56px;height:56px;padding:0;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;background:none}
.way span{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:50%;overflow:hidden;color:#fff;
  -webkit-backdrop-filter:blur(8px) saturate(1.4);backdrop-filter:blur(8px) saturate(1.4);
  border:1px solid rgba(255,255,255,.65);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.8),inset 0 -6px 12px rgba(255,255,255,.12),0 10px 24px -10px rgba(40,16,30,.55);
  animation:float 2.6s ease-in-out infinite}
/* блик стекла: светлый отлив сверху и тонкий отсвет снизу */
.way span::before{content:"";position:absolute;left:10%;right:10%;top:4%;height:46%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.way span::after{content:"";position:absolute;left:22%;right:22%;bottom:7%;height:14%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.45),rgba(255,255,255,0) 70%);pointer-events:none}
.way svg{position:relative;width:24px;height:24px;filter:drop-shadow(0 1px 2px rgba(60,20,30,.45))}
.way:focus-visible{outline:2px solid #fff;outline-offset:3px}
.way.fwd span{background:linear-gradient(160deg,rgba(255,200,150,.55),rgba(226,118,63,.45));box-shadow:inset 0 1px 1px rgba(255,255,255,.8),inset 0 -6px 12px rgba(255,255,255,.12),0 10px 26px -8px rgba(217,105,47,.7),0 0 22px -4px rgba(255,190,130,.7)}
.way.back{width:46px;height:46px}
.way.back span{background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,236,226,.15));animation-delay:-1.3s}
.way.back svg{width:20px;height:20px}
.way:hover span{filter:brightness(1.08)}
.way[hidden]{display:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.way span{animation:none}}
/* тёмная дымка: полупрозрачные клубы и пряди (текстура шума). При проходе наплывает, затем расползается и редеет */
.mist{position:absolute;inset:0;z-index:150;pointer-events:none;overflow:hidden}
.mist .ml{position:absolute;inset:-35%;opacity:0;will-change:transform,opacity}
.mist .ml i{position:absolute;inset:0;background-size:100% 100%;animation:drift 38s ease-in-out infinite alternate}
.mist .ml:nth-child(2) i{animation-duration:47s;animation-direction:alternate-reverse}
.mist .ml:nth-child(3) i{animation-duration:31s}
@keyframes drift{from{transform:translate(-3%,1%) rotate(-2deg)}to{transform:translate(3%,-2%) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.mist .ml i{animation:none}}
.light{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);
  mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,253,245,1) 0%,rgba(255,244,220,1) 4%,rgba(255,220,170,.8) 11%,rgba(250,180,120,.42) 24%,rgba(220,140,120,.16) 42%,rgba(220,140,120,0) 64%)}
.portal{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,opacity;cursor:pointer}
.frame{position:absolute;inset:0;border:var(--t) solid var(--c);border-bottom:0;border-radius:50% 50% 0 0/42% 42% 0 0;
  box-shadow:0 -2px 22px -8px var(--c),inset 0 18px 26px -20px rgba(255,240,225,.6);
  background:radial-gradient(ellipse 75% 70% at 50% 72%,rgba(255,226,186,var(--in)) 0%,rgba(255,196,150,calc(var(--in)*.55)) 42%,rgba(255,196,150,0) 78%)}
/* свет из глубины тоннеля: свечение в проёме арки (--in) и световое пятно на полу у её основания */
.pool{position:absolute;left:-18%;right:-18%;bottom:-8%;height:16%;border-radius:50%;pointer-events:none;opacity:var(--pool);
  background:radial-gradient(ellipse at 50% 50%,rgba(255,222,176,.75) 0%,rgba(255,186,130,.3) 42%,rgba(255,186,130,0) 70%)}
.frame::after{content:"";position:absolute;inset:0;border:2px solid rgba(255,255,255,.6);border-bottom:0;border-radius:inherit}
.trees{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.person{position:absolute;left:50%;bottom:0;height:84%;transform:translateX(-50%);pointer-events:none}
.person img,.person svg{display:block;height:100%;width:auto;max-width:none}
/* тёплый контур от света из тоннеля — спикер освещён и встречает */
.person img{filter:drop-shadow(0 0 2px rgba(255,236,210,.7)) drop-shadow(0 0 16px rgba(255,206,160,.5))}
.glow{position:absolute;left:50%;bottom:4%;width:92%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#fffaf0 0%,#ffe2b0 26%,rgba(255,196,130,.5) 50%,rgba(255,196,130,0) 70%)}

/* подпись и управление */
.below{display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:center;padding:22px 0 10px}
.cap{min-height:96px;transition:opacity .35s ease}
.cap.out{opacity:0}
.cap .nm{font:500 clamp(1.5rem,1.3rem + 1vw,2rem)/1.2 var(--font-display)}
.cap .rl{color:var(--soft);font-size:.95rem}
.cap .mk{font:italic 400 1rem var(--font-display);color:var(--accent);margin-top:2px}
.ctrls{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font:600 1rem/1 var(--font-body);padding:1em 1.5em;border-radius:999px;border:0;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-warm{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 10px 26px -12px rgba(181,74,58,.7)}
.btn-round{width:48px;height:48px;padding:0;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);font-size:1.2rem}
.btn:disabled{opacity:.35;cursor:default}
.dots{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.dots button{font:500 .85rem var(--font-body);border:1.5px solid var(--line);background:#fff;color:var(--soft);border-radius:999px;padding:.45em .9em;cursor:pointer}
.dots button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{font-size:.85rem;color:var(--soft);padding:6px 0 48px}
@media (max-width:640px){
  .scene{height:auto;aspect-ratio:4/5;min-height:0;border-radius:16px}
  .below{grid-template-columns:1fr}
  .ctrls .btn-warm{flex:1}
}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
</style>
</head>
<body>
<div class="note">Прототип блока «Ведущие» · фото пока у Виктории Трофимовой и Ирины Виноградовой, у остальных — силуэты</div>

<div class="wrap">
  <div class="head">
    <div class="eyebrow">Ведущие</div>
    <h2>Кто проведёт вас по мосту</h2>
  </div>

  <div class="scene" id="scene" role="region" aria-roledescription="анфилада" aria-label="Ведущие фестиваля">
    <div class="world" id="world">
      <div class="sky" id="sky"></div>
      <canvas class="trees" id="trees" aria-hidden="true"></canvas>
      <canvas class="trees bloom" aria-hidden="true"></canvas><canvas class="trees bloom" aria-hidden="true"></canvas><canvas class="trees bloom" aria-hidden="true"></canvas><canvas class="trees bloom" aria-hidden="true"></canvas>
      <div class="water" id="water"></div>
      <div class="haze" id="haze"></div>
      <div class="dawn" id="dawn"></div>
      <div class="dusk" id="dusk"></div>
      <div class="light" id="light"></div>
    </div>
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <div class="mist" id="mist"><div class="ml"><i></i></div><div class="ml"><i></i></div><div class="ml"><i></i></div></div>
    <button class="way fwd" id="way-fwd" type="button" aria-label="Вперёд, к следующему ведущему"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span></button>
    <button class="way back" id="way-back" type="button" aria-label="Назад, к предыдущему ведущему" hidden><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span></button>
  </div>

  <div class="below">
    <div class="cap" id="cap" aria-live="polite"></div>
    <div class="ctrls">
      <button class="btn btn-round" id="prev" type="button" aria-label="Назад">←</button>
      <button class="btn btn-warm" id="next" type="button">Войти в арку</button>
    </div>
    <div class="dots" id="dots"></div>
  </div>
  <p class="hint">Можно нажать на арку, смахнуть вверх или влево, или листать стрелками на клавиатуре.</p>
</div>

<script>
(function(){
  /* ведущие; img — вырезанное фото на прозрачном фоне (от груди, голова ≈ 40% высоты), без img рисуется силуэт */
  var PEOPLE = [
    {n:"Виктория Трофимова", r:"Специалист по соединению с телом", mk:"«Улыбка» · мастер-класс 4", img:"img/trofimova.webp"},
    {n:"Ирина Виноградова", r:"Лечебный педагог", mk:"«Источник» · мастер-класс 2", img:"img/vinogradova.webp"},
    {n:"Инна Кочурова", r:"Специалист по эмоциональному процессу", mk:"«Улыбка» · мастер-класс 4"},
    {n:"Светлана Савельева", r:"Психолог, основатель центра «МирРа»", mk:"«Как Волк научился любить» · «Внутренняя вертикаль»"},
    {n:"Галина Власова", r:"Психолог, коуч, расстановщик", mk:"«Как не бояться любить…» · «Кто стоит за моим страхом?»"},
    {n:"Татьяна Елисеева", r:"Арт-терапевт, педагог", mk:"«Источник» · мастер-класс 2"},
    {n:"Любовь", r:"Вы прошли мост — от страха к любви", mk:"21 ноября · центр «МирРа»", end:true}
  ];
  var R = 1.18;                 // высота арки к ширине
  /* цвет арок: от сиреневого (страх) к абрикосовому (любовь) */
  var C0 = [222,170,200], C1 = [246,162,150], C2 = [252,198,130];
  function mix(a,b,t){ return a.map(function(v,i){ return Math.round(v+(b[i]-v)*t); }); }
  function colorAt(i){ var t = i/(PEOPLE.length-1); var c = t < .5 ? mix(C0,C1,t*2) : mix(C1,C2,(t-.5)*2); return 'rgb('+c.join(',')+')'; }

  var SIL = '<svg viewBox="0 0 200 230"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d9cf" stop-opacity=".6"/><stop offset=".7" stop-color="#d9b8d6" stop-opacity=".35"/><stop offset="1" stop-color="#d9b8d6" stop-opacity="0"/></linearGradient></defs>'+
            '<ellipse cx="100" cy="70" rx="38" ry="46" fill="url(#sg)"/><path d="M100 126c-48 0-84 26-92 74l-4 30h192l-4-30c-8-48-44-74-92-74z" fill="url(#sg)"/></svg>';

  /* терновник фоном: неподвижные деревья только по краям сцены, ветвей немного, редкие шипы.
     На кончиках веток — цветы, разложенные по четырём слоям: в начале деревья голые, слои проявляются
     по мере пути — к финалу терн в полном цвету. Всё рисуется на canvas при изменении размера (зерно фиксированное);
     область передней арки вычищается, чтобы ветки и цветы не заходили в проёмы. */
  function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var blooms = document.querySelectorAll('.bloom');
  function canvasCtx(cv, dpr){ cv.width = W*dpr; cv.height = H*dpr; var c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.lineCap = 'round'; return c; }
  function drawTrees(){
    var dpr = Math.min(2, devicePixelRatio || 1), rnd = rng(7);
    var ctx = canvasCtx(document.getElementById('trees'), dpr);
    var bctx = Array.prototype.map.call(blooms, function(cv){ return canvasCtx(cv, dpr); });
    var tips = [];
    function tree(x, len, out, color, near){                 // out: -1 — крона клонится влево, 1 — вправо (наружу от арки)
      ctx.strokeStyle = color;
      (function branch(x,y,len,ang,depth,w){
        var x2 = x + Math.cos(ang)*len, y2 = y + Math.sin(ang)*len;
        ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
        if (depth < 4){                                     // шипы
          ctx.lineWidth = Math.max(.7, w*.5);
          for (var s=0;s<2;s++){
            var f = .25+s*.35+rnd()*.15, tx = x+(x2-x)*f, ty = y+(y2-y)*f, ta = ang+(s?1:-1)*(0.9+rnd()*0.5), tl = len*(0.16+rnd()*0.06);
            ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx+Math.cos(ta)*tl, ty+Math.sin(ta)*tl); ctx.stroke();
          }
        }
        if (depth <= 1) tips.push([x2, y2, near]);
        if (depth <= 0) return;
        for (var i=0;i<2;i++){
          var spread = (i ? 1 : -1) * (0.35+rnd()*0.3) + out*0.12 + (rnd()-.5)*0.2;
          branch(x2,y2,len*(0.66+rnd()*0.12),ang+spread,depth-1,w*0.66);
        }
      })(x, VY+4, len, -Math.PI/2 + out*0.08, 5, Math.max(2, len*0.1));
    }
    /* по три дерева у каждого края: дальние — светлые тёплые силуэты в дымке, ближние темнее и выше */
    [[-1,'#a07186',0],[1,'#a07186',0],[-1,'#5c3650',1],[1,'#5c3650',1]].forEach(function(g,k){
      for (var j=0;j<3;j++){
        var edge = (j + rnd()*0.6) / 3 * (W/2 - A0*0.55);       // от края сцены до арки
        var x = g[0] < 0 ? edge : W - edge;
        tree(x, H*(k < 2 ? 0.1 + rnd()*0.05 : 0.15 + rnd()*0.07), g[0], g[1], g[2]);
      }
    });
    /* светящиеся цветы терна: белые с розовой серединкой и мягким ореолом */
    tips.forEach(function(p){
      var tier = Math.floor(rnd()*4), c = bctx[tier], n = 1 + Math.floor(rnd()*3);
      for (var j=0;j<n;j++){
        var r = (1.6 + rnd()*1.6) * (p[2] ? 1.25 : 0.9), x = p[0] + (rnd()-.5)*8, y = p[1] + (rnd()-.5)*8;
        c.fillStyle = 'rgba(255,236,240,.22)'; c.beginPath(); c.arc(x, y, r*2.3, 0, 7); c.fill();
        c.fillStyle = 'rgba(255,250,248,.95)'; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
        c.fillStyle = 'rgba(236,150,175,.9)'; c.beginPath(); c.arc(x, y, r*0.38, 0, 7); c.fill();
      }
    });
    /* вычищаем область передней арки (и коридора в ней) */
    var aw = A0*1.08, ah = A0*R*1.04, ax = W/2 - aw/2, ay = FLOOR - ah;
    [ctx].concat(bctx).forEach(function(c){
      c.globalCompositeOperation = 'destination-out';
      c.beginPath(); c.moveTo(ax, FLOOR); c.lineTo(ax, ay + aw/2); c.arc(W/2, ay + aw/2, aw/2, Math.PI, 0); c.lineTo(ax+aw, FLOOR); c.closePath(); c.fill();
      c.globalCompositeOperation = 'source-over';
    });
  }

  var scene = document.getElementById('scene'), world = document.getElementById('world'), swiped = false;
  var portals = PEOPLE.map(function(p,i){
    var el = document.createElement('div');
    el.className = 'portal';
    el.style.setProperty('--c', colorAt(i));
    var lit = i/(PEOPLE.length-1);                          // чем ближе к свету в конце, тем ярче проём и пятно на полу
    el.style.setProperty('--in', (0.16 + 0.5*lit).toFixed(3));
    el.style.setProperty('--pool', (0.35 + 0.6*lit).toFixed(3));
    el.innerHTML = '<div class="pool"></div><div class="frame"></div>' +
      (p.end ? '<div class="glow"></div>' : '<div class="person">'+(p.img ? '<img src="'+p.img+'" alt="'+p.n+'" draggable="false">' : SIL)+'</div>');
    el.addEventListener('click', function(){ if (swiped) return; if (Math.round(cam) === i) go(i+1); else go(i); });
    world.appendChild(el);
    return el;
  });


  /* геометрия: глаза спикера на уровне горизонта, коридор уходит вправо и вглубь к свету */
  var W, H, A0, VY, FLOOR, K, wayFwd = document.getElementById('way-fwd'), wayBack = document.getElementById('way-back');
  function measure(){
    W = scene.clientWidth; H = scene.clientHeight;
    FLOOR = H*0.97;
    A0 = Math.min(W*(W < 640 ? 0.78 : 0.72), H*0.82/R, 460);
    VY = FLOOR - A0*R*0.66;
    K = 0.45 / (Math.pow(6,1.2) / (1+6*0.38));             // изгиб дуги: шестая арка уходит вправо на ~45% ширины арки — свет в конце виден в проёме
    portals.forEach(function(el){ el.style.width = A0+'px'; el.style.height = A0*R+'px'; el.style.setProperty('--t', Math.max(7, A0*0.04)+'px'); });
    document.getElementById('sky').style.height = VY+'px';
    document.getElementById('water').style.top = VY+'px';
    document.getElementById('haze').style.top = VY+'px';
    /* дымка только вокруг: окно по форме коридора — от передней арки к свету — остаётся чистым */
    var hole = 'radial-gradient('+(A0*0.78).toFixed(0)+'px '+(A0*R*0.64).toFixed(0)+'px at '+(W/2 + A0*0.2).toFixed(0)+'px '+(FLOOR - A0*R*0.5).toFixed(0)+'px, transparent 0%, transparent 60%, #000 100%)';
    mist.style.webkitMaskImage = mist.style.maskImage = hole;
    drawTrees(); sizeFx();
    /* стрелки у передней арки: «вперёд» справа на уровне плеч спикера, «назад» слева ниже */
    var ah = A0*R, al = W/2 - A0/2, ar = W/2 + A0/2;
    wayFwd.style.transform = 'translate('+Math.min(ar + 12, W - 62).toFixed(0)+'px,'+(FLOOR - ah*0.62).toFixed(0)+'px)';
    wayBack.style.transform = 'translate('+Math.max(8, al - 58).toFixed(0)+'px,'+(FLOOR - ah*0.3).toFixed(0)+'px)';
  }
  function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function place(d){                                        // центр низа и масштаб арки на глубине d; путь вглубь заворачивает дугой вправо
    var s = d >= 0 ? 1/(1+d*0.38) : 1/(1+d*1.4);
    var shift = d > 0 ? A0*K*Math.pow(d,1.2)*s : 0;
    return {s:s, x:W/2 + shift, y:VY + (FLOOR-VY)*s};
  }
  var cam = 0, PROG = 0, LX = 0, LY = 0, light = document.getElementById('light'), dusk = document.getElementById('dusk'), dawn = document.getElementById('dawn');
  function render(){
    portals.forEach(function(el,i){
      var d = i - cam;
      if (d < -0.6 || d > 8){ el.style.visibility = 'hidden'; return; }
      el.style.visibility = 'visible';
      var p = place(d), w = A0*p.s;
      el.style.transform = 'translate('+(p.x-w/2)+'px,'+(p.y-w*R)+'px) scale('+p.s+')';
      el.style.opacity = d < 0 ? clamp(1+d/0.5) : clamp(1-Math.max(0,d-4.5)*0.3);
      el.style.zIndex = 100 - Math.round(d*10);
      /* люди в дальних арках не прозрачные, а в тени — чтобы не выглядели призраками */
      var who = el.querySelector('.person');
      if (who){
        who.style.opacity = d < 0 ? clamp(1+d/0.3) : clamp(1-Math.max(0,d-1.6)*0.8);
        who.style.filter = d > 0.02 ? 'brightness('+(1-Math.min(d,2)*0.28).toFixed(3)+') saturate('+(1-Math.min(d,2)*0.2).toFixed(3)+')' : '';
      }
    });
    /* свет в конце коридора — за последней аркой */
    var e = place(PEOPLE.length - cam + 0.6), lw = A0*e.s;
    LX = e.x; LY = e.y - lw*R*0.45;
    light.style.left = LX+'px'; light.style.top = LY+'px';
    var size = Math.max(W, H) * (0.9 + 0.5*clamp(1 - (PEOPLE.length-1-cam)/3));
    light.style.width = light.style.height = size+'px';
    /* от страха к любви: с каждым шагом теплеет небо, уходит виньетка, терн зацветает, свет в конце ярче */
    PROG = cam/(PEOPLE.length-1);
    dawn.style.opacity = PROG.toFixed(3);
    dusk.style.opacity = (1 - 0.8*PROG).toFixed(3);
    light.style.opacity = (0.75 + 0.25*PROG).toFixed(3);
    /* в начале деревья голые; слои огоньков проявляются один за другим, к финалу — все */
    blooms.forEach(function(b,j){ b.style.opacity = clamp((PROG - 0.08 - j*0.2)*4).toFixed(3); });
  }

  /* переход: проходим сквозь арку в тёмную дымку — она расползается в стороны и редеет, проступает следующий спикер.
     Дымка — три слоя шумовой текстуры (SVG feTurbulence), каждый со своим рисунком; прозрачность берётся из шума,
     поэтому между клубами остаются просветы. Текстура растеризуется один раз, двигаются только слои. */
  var mist = document.getElementById('mist'), layers = mist.querySelectorAll('.ml');
  function smokeSVG(seed, freq){
    return 'url("data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900"><filter id="f" x="0" y="0" width="100%" height="100%">' +
      '<feTurbulence type="fractalNoise" baseFrequency="'+freq+'" numOctaves="5" seed="'+seed+'"/>' +
      '<feColorMatrix values="0 0 0 0 .32  0 0 0 0 .17  0 0 0 0 .24  2.4 0 0 0 -1.05"/></filter>' +
      '<rect width="100%" height="100%" filter="url(#f)"/></svg>') + '")';
  }
  [[3,'.0035 .005'],[9,'.005 .0065'],[17,'.0028 .004']].forEach(function(p,j){ layers[j].firstChild.style.backgroundImage = smokeSVG(p[0], p[1]); });
  var DIRS = [[-1,.25],[1,-.15],[.2,-1]];                   // куда расползается каждый слой
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var target = 0, anim = null;
  function ease(t){ return t < .5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
  function smooth(t){ return t*t*(3-2*t); }
  /* thick — густота дымки 0…1 сверх постоянной (BASE); spread — насколько она расползлась (0 — собрана, 1 — разошлась) */
  var BASE = 0.32;
  function setMist(thick, spread){
    var base = BASE*(1 - 0.6*PROG), peak = 0.8*(1 - 0.35*PROG);   // к финалу дымки меньше
    layers.forEach(function(l,j){
      var d = DIRS[j], m = spread*22;
      l.style.opacity = ((base + (peak-base)*thick) * (j === 2 ? .7 : 1)).toFixed(3);
      l.style.transform = 'translate('+(d[0]*m).toFixed(2)+'%,'+(d[1]*m).toFixed(2)+'%) scale('+(1 + spread*0.35 + (1-thick)*0.08).toFixed(3)+')';
    });
  }
  /* назад на две арки и больше — без шагов: вся сцена гаснет и проявляется сразу на нужной арке */
  function fadeTo(i){
    if (anim) cancelAnimationFrame(anim.raf);
    anim = {fade:true};
    [world, mist, fx].forEach(function(el){ el.style.transition = 'opacity .35s ease'; el.style.opacity = 0; });
    setTimeout(function(){
      cam = i; render(); setMist(0,0);
      [world, mist, fx].forEach(function(el){ el.style.transition = 'opacity .5s ease'; el.style.opacity = 1; });
      setTimeout(function(){ anim = null; [world, mist, fx].forEach(function(el){ el.style.transition = ''; }); }, 500);
    }, 350);
  }
  function go(i){
    i = Math.max(0, Math.min(PEOPLE.length-1, i));
    if (anim && anim.fade) return;
    if (i === target && !anim) return;
    target = i; caption(i);
    if (i < cam - 1.001){ fadeTo(i); return; }             // на одну арку назад — обычный проход, дальше — затемнение
    if (reduce){ layers.forEach(function(l){ l.style.transition = 'opacity .3s'; }); setMist(1,0); setTimeout(function(){ cam = i; render(); setMist(0,0); }, 300); return; }
    if (anim) cancelAnimationFrame(anim.raf);
    var from = cam, dist = Math.abs(i-from), dur = 1700*Math.sqrt(dist), t0 = performance.now();
    anim = {};
    (function step(now){
      var t = clamp((now-t0)/dur), e = ease(t);
      cam = from + (i-from)*e; render();
      var thick = t < .4 ? smooth(t/.4) : 1 - smooth((t-.4)/.6);      // дымка наплывает и медленно расползается
      setMist(thick, t < .4 ? 0 : smooth((t-.4)/.6));
      if (t < 1) anim.raf = requestAnimationFrame(step);
      else { anim = null; cam = i; render(); setMist(0,0); }
    })(t0);
  }

  /* золотая пыльца: медленно плывёт из света в конце тоннеля навстречу, вырастая по мере приближения.
     Лепестки терна: появляются во второй половине пути и к финалу кружат по всей сцене.
     Анимация идёт, только пока сцена на экране; при «уменьшении движения» — выключена. */
  var fx = document.getElementById('fx'), fctx, dprFx = 1, motes = [], petals = [], fxRaf = 0, fxLast = 0, fxOn = false;
  function sizeFx(){ dprFx = Math.min(2, devicePixelRatio || 1); fx.width = W*dprFx; fx.height = H*dprFx; fctx = fx.getContext('2d'); fctx.setTransform(dprFx,0,0,dprFx,0,0); }
  var frnd = Math.random;
  function newMote(m, fresh){
    m.a = frnd()*Math.PI*2; m.age = fresh ? frnd() : 0; m.life = 6 + frnd()*5; m.sz = 0.6 + frnd()*0.9; m.ph = frnd()*7;
    return m;
  }
  function newPetal(p, fresh){
    p.x = frnd()*W*1.2 - W*0.1; p.y = fresh ? frnd()*H : -12; p.vy = 14 + frnd()*18; p.vx = -6 - frnd()*10;
    p.rot = frnd()*7; p.vr = (frnd()-.5)*2; p.sz = 3 + frnd()*3; p.ph = frnd()*7;
    return p;
  }
  for (var q=0;q<46;q++) motes.push(newMote({}, true));
  for (var q2=0;q2<34;q2++) petals.push(newPetal({}, true));
  function fxFrame(now){
    var dt = Math.min(0.05, (now - (fxLast || now))/1000); fxLast = now;
    fctx.clearRect(0, 0, W, H);
    fctx.globalCompositeOperation = 'lighter';
    var R0 = Math.max(W, H)*0.75, glow = 0.55 + 0.45*PROG;
    motes.forEach(function(m){
      m.age += dt/m.life; if (m.age > 1) newMote(m);
      var t = m.age, dist = Math.pow(t, 1.7)*R0;
      var x = LX + Math.cos(m.a)*dist + Math.sin(now/900 + m.ph)*6, y = LY + Math.sin(m.a)*dist*0.55;
      var r = m.sz*(0.6 + t*3.2), al = Math.sin(Math.PI*t)*0.8*glow;
      fctx.fillStyle = 'rgba(255,206,130,'+(al*0.18).toFixed(3)+')'; fctx.beginPath(); fctx.arc(x, y, r*3.2, 0, 7); fctx.fill();
      fctx.fillStyle = 'rgba(255,240,200,'+al.toFixed(3)+')'; fctx.beginPath(); fctx.arc(x, y, r, 0, 7); fctx.fill();
    });
    fctx.globalCompositeOperation = 'source-over';
    var np = Math.round(petals.length * clamp((PROG - 0.35)/0.6));
    for (var i=0;i<np;i++){
      var p = petals[i];
      p.y += p.vy*dt; p.x += (p.vx + Math.sin(now/700 + p.ph)*12)*dt; p.rot += p.vr*dt;
      if (p.y > H + 12 || p.x < -20) newPetal(p);
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot); fctx.scale(1, 0.55 + 0.35*Math.sin(now/400 + p.ph));
      fctx.fillStyle = 'rgba(255,244,246,.9)'; fctx.beginPath(); fctx.ellipse(0, 0, p.sz, p.sz*0.62, 0, 0, 7); fctx.fill();
      fctx.fillStyle = 'rgba(244,182,200,.75)'; fctx.beginPath(); fctx.ellipse(p.sz*0.35, 0, p.sz*0.35, p.sz*0.3, 0, 0, 7); fctx.fill();
      fctx.restore();
    }
    fxRaf = requestAnimationFrame(fxFrame);
  }
  function fxRun(on){
    if (reduce || on === fxOn) return;
    fxOn = on; cancelAnimationFrame(fxRaf); fxLast = 0;
    if (on) fxRaf = requestAnimationFrame(fxFrame);
  }
  if ('IntersectionObserver' in window) new IntersectionObserver(function(es){ fxRun(es[0].isIntersecting); }).observe(scene);
  else fxRun(true);

  /* подпись, кнопки, точки */
  var cap = document.getElementById('cap'), next = document.getElementById('next'), prev = document.getElementById('prev'), dots = document.getElementById('dots');
  dots.innerHTML = PEOPLE.map(function(p,i){ return '<button type="button" data-i="'+i+'">'+(p.end ? 'Финал' : p.n.split(' ')[0])+'</button>'; }).join('');
  dots.querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ go(+b.dataset.i); }); });
  var capTimer;
  function caption(i){
    var p = PEOPLE[i];
    clearTimeout(capTimer); cap.classList.add('out');
    capTimer = setTimeout(function(){
      cap.innerHTML = '<div class="nm">'+p.n+'</div><div class="rl">'+p.r+'</div><div class="mk">'+p.mk+'</div>';
      cap.classList.remove('out');
    }, reduce ? 0 : 450);
    prev.disabled = i === 0;
    next.textContent = p.end ? 'Записаться' : i === 0 ? 'Войти в арку' : 'Пройти дальше';
    dots.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-current', +b.dataset.i === i); });
    wayBack.hidden = i === 0; wayFwd.hidden = !!p.end;
  }
  next.addEventListener('click', function(){ if (PEOPLE[target].end) location.href = '../index.html#tickets'; else go(target+1); });
  prev.addEventListener('click', function(){ go(target-1); });
  wayFwd.addEventListener('click', function(){ go(target+1); });
  wayBack.addEventListener('click', function(){ go(target-1); });
  document.addEventListener('keydown', function(e){
    if (e.target.closest('input,textarea,select')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp'){ e.preventDefault(); go(target+1); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ e.preventDefault(); go(target-1); }
  });

  /* свайп: вверх или влево — вперёд, вправо — назад */
  var sx, sy;
  scene.addEventListener('pointerdown', function(e){ sx = e.clientX; sy = e.clientY; swiped = false; });
  scene.addEventListener('pointerup', function(e){
    if (sx == null) return;
    var dx = e.clientX-sx, dy = e.clientY-sy; sx = null;
    if (Math.max(Math.abs(dx),Math.abs(dy)) < 40) return;
    swiped = true;
    if (dy < -40 && Math.abs(dy) > Math.abs(dx) || dx < -40) go(target+1); else if (dx > 40) go(target-1);
  });

  measure(); render(); caption(0); setMist(0,0);
  addEventListener('resize', function(){ measure(); render(); });
})();
</script>
</body>
</html>
