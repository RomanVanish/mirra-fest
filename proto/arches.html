<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анфилада арок · прототип</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
/* Прототип блока «Ведущие»: анфилада арок в тёмном колючем лесу. Передняя арка по центру, остальные уходят
   вглубь по дуге к свету. Проход сквозь арку — тёмная дымка сгущается и рассеивается, с каждым шагом светлее.
   Палитра и шрифты страницы — как на сайте (page.html). */
:root{
  --ink:#3b2731; --soft:#7a6068; --bg:#fffaf5; --line:#f0ddd0;
  --accent:#b54a3a; --accent-2:#d9692f;
  --font-display:"Lora", Georgia, serif;
  --font-body:"Inter", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
.note{font-size:.8rem;color:var(--soft);text-align:center;padding:8px 16px;background:#f6e6ef}
.head{padding:40px 0 20px;display:grid;gap:10px}
.eyebrow{font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--accent)}
h2{font:500 clamp(2rem,1.6rem + 2vw,3rem)/1.15 var(--font-display);margin:0}

/* сцена */
.scene{position:relative;height:min(74vh,700px);min-height:440px;border-radius:22px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#2a1d40}
.world{position:absolute;inset:0;will-change:filter}
.sky{position:absolute;left:0;right:0;top:0;background:linear-gradient(180deg,#0e0918 0%,#171026 50%,#241936 85%,#2f2145 100%)}
.water{position:absolute;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 9px,rgba(255,226,200,.035) 9px 10px),linear-gradient(180deg,#2a1d3e 0%,#1b1229 45%,#0f0a19 100%)}
.haze{position:absolute;left:0;right:0;height:22%;transform:translateY(-60%);pointer-events:none;
  background:linear-gradient(180deg,rgba(110,80,140,0),rgba(120,90,150,.22) 55%,rgba(110,80,140,0))}
.trees{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* общая тьма: чем глубже по коридору, тем светлее */
.dusk{position:absolute;inset:0;background:#0b0713;pointer-events:none}
/* тёмная дымка при проходе: сгущается, затем расходится в стороны */
.mist{position:absolute;inset:0;z-index:150;pointer-events:none;opacity:0;overflow:hidden}
.mist i{position:absolute;left:50%;top:50%;width:85%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(12,8,22,.96) 0%,rgba(12,8,22,.75) 38%,rgba(12,8,22,0) 70%)}
.light{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);
  mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,253,245,1) 0%,rgba(255,244,220,1) 4%,rgba(255,220,170,.8) 11%,rgba(250,180,120,.42) 24%,rgba(220,140,120,.16) 42%,rgba(220,140,120,0) 64%)}
.portal{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,opacity;cursor:pointer}
.frame{position:absolute;inset:0;border:var(--t) solid var(--c);border-bottom:0;border-radius:50% 50% 0 0/42% 42% 0 0;
  box-shadow:0 -4px 36px -6px var(--c),inset 0 24px 36px -22px var(--c)}
.frame::after{content:"";position:absolute;inset:0;border:2px solid rgba(255,255,255,.45);border-bottom:0;border-radius:inherit}
.person{position:absolute;left:50%;bottom:0;height:84%;transform:translateX(-50%);pointer-events:none}
.person img,.person svg{display:block;height:100%;width:auto;max-width:none}
.glow{position:absolute;left:50%;bottom:4%;width:92%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#fffaf0 0%,#ffe2b0 26%,rgba(255,196,130,.5) 50%,rgba(255,196,130,0) 70%)}

/* подпись и управление */
.below{display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:center;padding:22px 0 10px}
.cap{min-height:96px;transition:opacity .35s ease}
.cap.out{opacity:0}
.cap .nm{font:500 clamp(1.5rem,1.3rem + 1vw,2rem)/1.2 var(--font-display)}
.cap .rl{color:var(--soft);font-size:.95rem}
.cap .mk{font:italic 400 1rem var(--font-display);color:var(--accent);margin-top:2px}
.ctrls{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font:600 1rem/1 var(--font-body);padding:1em 1.5em;border-radius:999px;border:0;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-warm{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 10px 26px -12px rgba(181,74,58,.7)}
.btn-round{width:48px;height:48px;padding:0;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);font-size:1.2rem}
.btn:disabled{opacity:.35;cursor:default}
.dots{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.dots button{font:500 .85rem var(--font-body);border:1.5px solid var(--line);background:#fff;color:var(--soft);border-radius:999px;padding:.45em .9em;cursor:pointer}
.dots button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{font-size:.85rem;color:var(--soft);padding:6px 0 48px}
@media (max-width:640px){
  .scene{height:auto;aspect-ratio:4/5;min-height:0;border-radius:16px}
  .below{grid-template-columns:1fr}
  .ctrls .btn-warm{flex:1}
}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
</style>
</head>
<body>
<div class="note">Прототип блока «Ведущие» · фото пока у Виктории Трофимовой и Ирины Виноградовой, у остальных — силуэты</div>

<div class="wrap">
  <div class="head">
    <div class="eyebrow">Ведущие</div>
    <h2>Кто проведёт вас по мосту</h2>
  </div>

  <div class="scene" id="scene" role="region" aria-roledescription="анфилада" aria-label="Ведущие фестиваля">
    <div class="world" id="world">
      <div class="sky" id="sky"></div>
      <canvas class="trees" id="trees" aria-hidden="true"></canvas>
      <div class="water" id="water"></div>
      <div class="haze" id="haze"></div>
      <div class="dusk" id="dusk"></div>
      <div class="light" id="light"></div>
    </div>
    <div class="mist" id="mist"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="below">
    <div class="cap" id="cap" aria-live="polite"></div>
    <div class="ctrls">
      <button class="btn btn-round" id="prev" type="button" aria-label="Назад">←</button>
      <button class="btn btn-warm" id="next" type="button">Войти в арку</button>
    </div>
    <div class="dots" id="dots"></div>
  </div>
  <p class="hint">Можно нажать на арку, смахнуть вверх или влево, или листать стрелками на клавиатуре.</p>
</div>

<script>
(function(){
  /* ведущие; img — вырезанное фото на прозрачном фоне (от груди, голова ≈ 40% высоты), без img рисуется силуэт */
  var PEOPLE = [
    {n:"Виктория Трофимова", r:"Специалист по соединению с телом", mk:"«Улыбка» · мастер-класс 4", img:"img/trofimova.webp"},
    {n:"Ирина Виноградова", r:"Лечебный педагог", mk:"«Источник» · мастер-класс 2", img:"img/vinogradova.webp"},
    {n:"Инна Кочурова", r:"Специалист по эмоциональному процессу", mk:"«Улыбка» · мастер-класс 4"},
    {n:"Светлана Савельева", r:"Психолог, основатель центра «МирРа»", mk:"«Как Волк научился любить» · «Внутренняя вертикаль»"},
    {n:"Галина Власова", r:"Психолог, коуч, расстановщик", mk:"«Как не бояться любить…» · «Кто стоит за моим страхом?»"},
    {n:"Татьяна Елисеева", r:"Арт-терапевт, педагог", mk:"«Источник» · мастер-класс 2"},
    {n:"Любовь", r:"Вы прошли мост — от страха к любви", mk:"21 ноября · центр «МирРа»", end:true}
  ];
  var R = 1.18;                 // высота арки к ширине
  /* цвет арок: от сиреневого (страх) к абрикосовому (любовь) */
  var C0 = [168,140,200], C1 = [232,130,128], C2 = [246,170,100];
  function mix(a,b,t){ return a.map(function(v,i){ return Math.round(v+(b[i]-v)*t); }); }
  function colorAt(i){ var t = i/(PEOPLE.length-1); var c = t < .5 ? mix(C0,C1,t*2) : mix(C1,C2,(t-.5)*2); return 'rgb('+c.join(',')+')'; }

  var SIL = '<svg viewBox="0 0 200 230"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d9cf" stop-opacity=".6"/><stop offset=".7" stop-color="#d9b8d6" stop-opacity=".35"/><stop offset="1" stop-color="#d9b8d6" stop-opacity="0"/></linearGradient></defs>'+
            '<ellipse cx="100" cy="70" rx="38" ry="46" fill="url(#sg)"/><path d="M100 126c-48 0-84 26-92 74l-4 30h192l-4-30c-8-48-44-74-92-74z" fill="url(#sg)"/></svg>';

  var scene = document.getElementById('scene'), world = document.getElementById('world'), swiped = false;
  var portals = PEOPLE.map(function(p,i){
    var el = document.createElement('div');
    el.className = 'portal';
    el.style.setProperty('--c', colorAt(i));
    el.innerHTML = '<div class="frame"></div>' +
      (p.end ? '<div class="glow"></div>' : '<div class="person">'+(p.img ? '<img src="'+p.img+'" alt="'+p.n+'" draggable="false">' : SIL)+'</div>');
    el.addEventListener('click', function(){ if (swiped) return; if (Math.round(cam) === i) go(i+1); else go(i); });
    world.appendChild(el);
    return el;
  });

  /* колючий лес фоном: несколько рядов кривых терновых деревьев с шипами; рисуется на canvas один раз при изменении размера.
     Зерно фиксированное — при пересчёте лес тот же. Дальние ряды светлее (в дымке), ближние темнее и крупнее. */
  function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function drawTrees(){
    var cv = document.getElementById('trees'), dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = W*dpr; cv.height = H*dpr;
    var ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap = 'round';
    var rnd = rng(7);
    function tree(x, y, len, color){
      ctx.strokeStyle = color;
      (function branch(x,y,len,ang,depth,w){
        var x2 = x + Math.cos(ang)*len, y2 = y + Math.sin(ang)*len;
        ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
        if (depth < 4){                                    // шипы
          ctx.lineWidth = Math.max(.5, w*.45);
          for (var j=0;j<3;j++){ var f = .2+.3*j, tx = x+(x2-x)*f, ty = y+(y2-y)*f, ta = ang+(rnd()<.5?1:-1)*(0.8+rnd()*0.6), tl = len*(0.12+rnd()*0.1);
            ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx+Math.cos(ta)*tl, ty+Math.sin(ta)*tl); ctx.stroke(); }
        }
        if (depth <= 0) return;
        var n = rnd() < .35 ? 3 : 2;
        for (var i=0;i<n;i++){
          var spread = (i - (n-1)/2) * (0.5+rnd()*0.35) + (rnd()-.5)*0.45;   // кривые, «изломанные» ветки
          branch(x2,y2,len*(0.62+rnd()*0.18),ang+spread,depth-1,w*0.66);
        }
      })(x, y, len, -Math.PI/2+(rnd()-.5)*0.35, 6, Math.max(1.5, len*0.09));
    }
    /* ряды: [сколько деревьев, высота от/до (доля высоты сцены), цвет, насколько ниже горизонта основание] */
    var rows = [[Math.round(W/16), .12, .22, '#4a3768', 0], [Math.round(W/26), .18, .32, '#33254b', 3], [Math.round(W/46), .30, .50, '#140c20', 8]];
    rows.forEach(function(r){
      for (var k=0;k<r[0];k++){
        var x = (k + rnd()) / r[0] * (W+40) - 20, h = H*(r[1] + rnd()*(r[2]-r[1]));
        tree(x, VY + r[4], h*0.3, r[3]);
      }
    });
  }

  /* геометрия: глаза спикера на уровне горизонта, коридор уходит вправо и вглубь к свету */
  var W, H, A0, VY, FLOOR, K;
  function measure(){
    W = scene.clientWidth; H = scene.clientHeight;
    FLOOR = H*0.97;
    A0 = Math.min(W*(W < 640 ? 0.78 : 0.72), H*0.82/R, 460);
    VY = FLOOR - A0*R*0.66;
    K = 0.36*W / (Math.pow(6,1.5) * A0 / (1+6*0.38));      // изгиб дуги: шестая арка уходит вправо на ~36% ширины сцены
    portals.forEach(function(el){ el.style.width = A0+'px'; el.style.height = A0*R+'px'; el.style.setProperty('--t', Math.max(7, A0*0.04)+'px'); });
    document.getElementById('sky').style.height = VY+'px';
    document.getElementById('water').style.top = VY+'px';
    document.getElementById('haze').style.top = VY+'px';
    drawTrees();
  }
  function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function place(d){                                        // центр низа и масштаб арки на глубине d; путь вглубь заворачивает дугой вправо
    var s = d >= 0 ? 1/(1+d*0.38) : 1/(1+d*1.4);
    var shift = d > 0 ? A0*K*Math.pow(d,1.5)*s : 0;
    return {s:s, x:W/2 + shift, y:VY + (FLOOR-VY)*s};
  }
  var cam = 0, light = document.getElementById('light'), dusk = document.getElementById('dusk');
  function render(){
    portals.forEach(function(el,i){
      var d = i - cam;
      if (d < -0.6 || d > 8){ el.style.visibility = 'hidden'; return; }
      el.style.visibility = 'visible';
      var p = place(d), w = A0*p.s;
      el.style.transform = 'translate('+(p.x-w/2)+'px,'+(p.y-w*R)+'px) scale('+p.s+')';
      el.style.opacity = d < 0 ? clamp(1+d/0.5) : clamp(1-Math.max(0,d-4.5)*0.3);
      el.style.zIndex = 100 - Math.round(d*10);
      /* люди в дальних арках не прозрачные, а в тени — чтобы не выглядели призраками */
      var who = el.querySelector('.person');
      if (who){
        who.style.opacity = d < 0 ? clamp(1+d/0.3) : clamp(1-Math.max(0,d-1.6)*0.8);
        who.style.filter = d > 0.02 ? 'brightness('+(1-Math.min(d,2)*0.28).toFixed(3)+') saturate('+(1-Math.min(d,2)*0.2).toFixed(3)+')' : '';
      }
    });
    /* свет в конце коридора — за последней аркой */
    var e = place(PEOPLE.length - cam + 0.6), lw = A0*e.s;
    light.style.left = e.x+'px'; light.style.top = (e.y - lw*R*0.45)+'px';
    var size = Math.max(W, H) * (0.9 + 0.5*clamp(1 - (PEOPLE.length-1-cam)/3));
    light.style.width = light.style.height = size+'px';
    /* из тьмы к свету: с каждым шагом вглубь сцена светлее, свет в конце ярче */
    var k = cam/(PEOPLE.length-1);
    dusk.style.opacity = (0.4*(1-k)).toFixed(3);
    light.style.opacity = (0.6 + 0.4*k).toFixed(3);
  }

  /* переход: проходим сквозь арку в тёмную дымку, она расходится в стороны — и проступает следующий спикер */
  var mist = document.getElementById('mist'), blobs = mist.querySelectorAll('i');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var target = 0, anim = null;
  function ease(t){ return t < .5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
  function smooth(t){ return t*t*(3-2*t); }
  function setMist(dark, spread){
    mist.style.opacity = dark.toFixed(3);
    blobs.forEach(function(b,j){                           // клубы дымки разлетаются в разные стороны
      var a = j/blobs.length*Math.PI*2 + 0.4, r = spread*70;
      b.style.transform = 'translate(calc(-50% + '+(Math.cos(a)*r).toFixed(1)+'%), calc(-50% + '+(Math.sin(a)*r*0.8).toFixed(1)+'%)) scale('+(1+spread*0.9).toFixed(3)+')';
    });
  }
  function go(i){
    i = Math.max(0, Math.min(PEOPLE.length-1, i));
    if (i === target && !anim) return;
    target = i; caption(i);
    if (reduce){ mist.style.transition='opacity .3s'; setMist(.95,0); setTimeout(function(){ cam = i; render(); setMist(0,0); }, 300); return; }
    if (anim) cancelAnimationFrame(anim.raf);
    var from = cam, dist = Math.abs(i-from), dur = 1700*Math.sqrt(dist), t0 = performance.now();
    anim = {};
    (function step(now){
      var t = clamp((now-t0)/dur), e = ease(t);
      cam = from + (i-from)*e; render();
      var dark = t < .38 ? smooth(t/.38) : 1 - smooth((t-.38)/.62);   // тьма быстро сгущается и медленно рассеивается
      setMist(0.94*dark, t < .38 ? 0 : smooth((t-.38)/.62));
      world.style.filter = 'blur('+(2.5*dark).toFixed(2)+'px)';
      if (t < 1) anim.raf = requestAnimationFrame(step);
      else { anim = null; cam = i; render(); world.style.filter = ''; setMist(0,0); }
    })(t0);
  }

  /* подпись, кнопки, точки */
  var cap = document.getElementById('cap'), next = document.getElementById('next'), prev = document.getElementById('prev'), dots = document.getElementById('dots');
  dots.innerHTML = PEOPLE.map(function(p,i){ return '<button type="button" data-i="'+i+'">'+(p.end ? 'Финал' : p.n.split(' ')[0])+'</button>'; }).join('');
  dots.querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ go(+b.dataset.i); }); });
  var capTimer;
  function caption(i){
    var p = PEOPLE[i];
    clearTimeout(capTimer); cap.classList.add('out');
    capTimer = setTimeout(function(){
      cap.innerHTML = '<div class="nm">'+p.n+'</div><div class="rl">'+p.r+'</div><div class="mk">'+p.mk+'</div>';
      cap.classList.remove('out');
    }, reduce ? 0 : 450);
    prev.disabled = i === 0;
    next.textContent = p.end ? 'Записаться' : i === 0 ? 'Войти в арку' : 'Пройти дальше';
    dots.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-current', +b.dataset.i === i); });
  }
  next.addEventListener('click', function(){ if (PEOPLE[target].end) location.href = '../index.html#tickets'; else go(target+1); });
  prev.addEventListener('click', function(){ go(target-1); });
  document.addEventListener('keydown', function(e){
    if (e.target.closest('input,textarea,select')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp'){ e.preventDefault(); go(target+1); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ e.preventDefault(); go(target-1); }
  });

  /* свайп: вверх или влево — вперёд, вправо — назад */
  var sx, sy;
  scene.addEventListener('pointerdown', function(e){ sx = e.clientX; sy = e.clientY; swiped = false; });
  scene.addEventListener('pointerup', function(e){
    if (sx == null) return;
    var dx = e.clientX-sx, dy = e.clientY-sy; sx = null;
    if (Math.max(Math.abs(dx),Math.abs(dy)) < 40) return;
    swiped = true;
    if (dy < -40 && Math.abs(dy) > Math.abs(dx) || dx < -40) go(target+1); else if (dx > 40) go(target-1);
  });

  measure(); render(); caption(0);
  addEventListener('resize', function(){ measure(); render(); });
})();
</script>
</body>
</html>
